
<div class="profile-page">

  <header class="profile-header">
    <button class="back-button" (click)="goBack()">
      ← Back to Dashboard
    </button>
    <h2>My Profile</h2>
    <p>Manage your personal information</p>
  </header>

  <div *ngIf="loading" class="message">
    Loading profile...
  </div>

  <div *ngIf="!loading" class="profile-card">

    <div class="profile-avatar">
      {{ initials }}
    </div>

    <h3>{{ profile.full_name }}</h3>
    <span class="role-badge">
      {{ profile.role === 'LOAN_OFFICER' ? 'Loan Officer' : 'Customer' }}
    </span>

    <div class="form-section">

      <div class="form-group">
        <label>Full Name</label>
        <input
          type="text"
          [(ngModel)]="profile.full_name"
          placeholder="Enter your full name"
          required
          minlength="2"
          maxlength="100">
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <input
          type="email"
          [value]="profile.email"
          disabled>
        <small>Email cannot be changed.</small>
      </div>

      <div class="form-group">
        <label>Phone Number</label>
        <input
          type="tel"
          [(ngModel)]="profile.phone"
          placeholder="Enter your phone number"
          required
          minlength="7"
          maxlength="20">
      </div>

      <div class="form-group">
        <label>Account Role</label>
        <input
          type="text"
          [value]="profile.role"
          disabled>
      </div>

      <p *ngIf="successMessage" class="success-message">
        {{ successMessage }}
      </p>

      <p *ngIf="errorMessage" class="error-message">
        {{ errorMessage }}
      </p>

      <button
        class="save-button"
        (click)="saveProfile()"
        [disabled]="saving || !profile.full_name?.trim() || !profile.phone?.trim()">
        {{ saving ? 'Saving...' : 'Save Changes' }}
      </button>

    </div>
  </div>
</div>
